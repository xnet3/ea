<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f6f8fc">
<title>כוחות הביטחון וההצלה</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<link id="favicon" rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { overflow-anchor: none; }

:root {
  --bg: #f6f8fc;
  --card-bg: #ffffff;
  --text: #1e2533;
  --muted: #667085;
  --border: #e8ecf3;
  --accent: #4478ea;
  --accent-strong: #2f5fd0;
  --accent-soft: #eaf1ff;
  --accent-glow: rgba(68,120,234,.16);
  --signature-bg: #f0f3f9;
  --action-hover: #e8eefb;
  --shadow-card: 0 1px 2px rgba(30,37,51,.04), 0 4px 14px rgba(30,37,51,.04);
  --shadow-hover: 0 8px 28px rgba(30,37,51,.08);
  --radius: 18px;
  --radius-sm: 12px;
  --font: 'IBM Plex Sans Hebrew', system-ui, -apple-system, 'Segoe UI', sans-serif;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: var(--accent-soft); color: var(--accent-strong); }
svg { stroke-linecap: round; stroke-linejoin: round; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── TOP BARS (header + toolbar) - slide away on scroll down, return on scroll up ── */
#topbars {
  position: sticky; top: 0; z-index: 100;
  transition: transform .32s cubic-bezier(.4, 0, .2, 1);
  will-change: transform;
}
#topbars.hidden { transform: translateY(-100%); }

/* ── HEADER ── */
#header {
  height: 60px; padding: 0 24px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  background: rgba(255,255,255,.86);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
/* Brand (logo + name): fixed on the right, so it stays on the feed when the bars slide away */
#brand {
  position: fixed; z-index: 110;
  top: 0; right: 24px; height: 60px;
  display: flex; align-items: center; gap: 11px;
  padding-inline: 0;
  border: 1px solid transparent; border-radius: 999px; background: transparent;
  font-size: 19px; font-weight: 700; letter-spacing: -.4px;
  max-width: calc(100vw - 32px);
  transition: top .32s cubic-bezier(.4, 0, .2, 1), right .32s cubic-bezier(.4, 0, .2, 1),
              height .32s cubic-bezier(.4, 0, .2, 1), padding .32s cubic-bezier(.4, 0, .2, 1),
              background .3s, border-color .3s, box-shadow .3s;
}
body.bars-hidden #brand {
  top: 8px; right: 14px; height: 46px;
  padding-inline: 5px 16px;
  background: rgba(255,255,255,.94);
  -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px);
  border-color: var(--border);
  box-shadow: var(--shadow-card);
}
#header-logo {
  width: 36px; height: 36px; border-radius: 50%;
  object-fit: cover; flex-shrink: 0;
  border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border);
  background: var(--accent-soft);
}
#brand span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#status-pill {
  margin-inline-start: auto; /* brand is fixed, so push the pill to the far side */
  display: flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 13px 0 12px;
  border: 1px solid var(--border); background: #fff; border-radius: 999px;
  flex-shrink: 0;
  transition: background .2s, border-color .2s;
}
#status-dot { width: 7px; height: 7px; border-radius: 50%; background: #98a2b3; flex-shrink: 0; }
#status-dot.pulse { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 0 rgba(18,183,106,.4); }
  50% { box-shadow: 0 0 0 4px rgba(18,183,106,0); }
}
#status-text { font-size: 12.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
#status-pill.ok { background: #ecfdf3; border-color: #c7f0d8; }
#status-pill.ok #status-dot { background: #12b76a; }
#status-pill.ok #status-text { color: #067647; }
#status-pill.err { background: #fef3f2; border-color: #fdd3ce; }
#status-pill.err #status-dot { background: #f04438; }
#status-pill.err #status-text { color: #b42318; }

/* ── TOOLBAR (search + filters) ── */
#toolbar {
  background: rgba(246,248,252,.92);
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.tb-wrap { max-width: 700px; margin: 0 auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }
#search-wrap {
  display: flex; align-items: center; gap: 10px;
  height: 46px; padding: 0 16px;
  background: #fff; border: 1.5px solid var(--border); border-radius: 999px;
  color: var(--muted); box-shadow: var(--shadow-card);
  transition: border-color .15s, box-shadow .15s, color .15s;
}
#search-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); color: var(--accent); }
#q { flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: 500 16px var(--font); color: var(--text); }
#q::placeholder { color: var(--muted); font-weight: 400; }
#q::-webkit-search-cancel-button { display: none; }
#clr {
  display: none; width: 26px; height: 26px; border: none; border-radius: 50%;
  background: var(--signature-bg); color: var(--muted); cursor: pointer;
  align-items: center; justify-content: center; flex-shrink: 0;
  transition: background .15s, color .15s;
}
#clr:hover { background: var(--action-hover); color: var(--text); }
#search-wrap.has-value #clr { display: flex; }

#chips { display: flex; gap: 7px; overflow-x: auto; scrollbar-width: none; }
#chips::-webkit-scrollbar { display: none; }

/* ── CHANNELS SIDEBAR (right) ── */
#channels {
  position: fixed; z-index: 90; right: 10px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 4px;
  padding: 6px; max-height: calc(100vh - 240px); overflow-y: auto; scrollbar-width: none;
  background: rgba(255,255,255,.94);
  -webkit-backdrop-filter: saturate(180%) blur(14px); backdrop-filter: saturate(180%) blur(14px);
  border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-card);
}
#channels::-webkit-scrollbar { display: none; }
#channels[hidden] { display: none; }
.ch-item {
  display: flex; align-items: center; gap: 10px; width: 100%; padding: 4px;
  border: 1px solid transparent; border-radius: 14px; background: transparent; color: var(--muted);
  font: 500 13.5px var(--font); text-align: start; cursor: pointer; transition: all .15s;
}
.ch-item:hover { background: var(--action-hover); color: var(--text); }
.ch-item.active { background: var(--accent-soft); border-color: #c9daff; color: var(--accent-strong); font-weight: 600; }
.ch-ava { position: relative; width: 40px; height: 40px; flex-shrink: 0; }
.ch-ph, .ch-av {
  position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 50%;
  border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border);
}
.ch-ph { display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent-strong); font-size: 16px; font-weight: 600; }
.ch-av { object-fit: cover; background: #fff; }
.ch-name { display: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline-end: 8px; }
/* הפיד והסרגל העליון (חיפוש/סינון) ממורכזים באזור שנשאר משמאל לרשימת הערוצים */
body.has-side { --side-w: 80px; }
body.has-side #feed {
  width: calc(100% - var(--side-w)); max-width: 700px;
  margin-left: calc((100% - var(--side-w) - min(700px, 100% - var(--side-w))) / 2);
  margin-right: auto;
}
body.has-side #top-btn, body.has-side #toast { left: calc((100% - var(--side-w)) / 2); }
@media (min-width: 768px) {
  #channels { right: 20px; width: 190px; }
  .ch-name { display: block; }
  body.has-side { --side-w: 230px; }
}
@media (max-width: 640px) {
  #channels { right: 6px; padding: 5px; }
  .ch-ava { width: 34px; height: 34px; }
  body.has-side { --side-w: 70px; }
}
/* סרגל צד: למעלה כותרת וחיפוש, למטה רשימת הערוצים. הסרגלים העליונים מסתיימים לידו */
body.has-side #channels {
  top: 0; bottom: 0; right: 0; transform: none;
  width: var(--side-w); max-height: none; padding: 0; gap: 0; overflow: hidden;
  border: 0; border-left: 1px solid var(--border); border-radius: 0; box-shadow: none;
  background: rgba(255,255,255,.96); z-index: 120;
}
body.has-side #topbars { margin-right: var(--side-w); }
body.has-side #brand { right: calc(var(--side-w) + 24px); max-width: calc(100vw - var(--side-w) - 32px); }
body.has-side.bars-hidden #brand { right: calc(var(--side-w) + 14px); }
#side-top { display: flex; justify-content: center; padding: 14px 6px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
#side-title { display: flex; align-items: center; gap: 12px; }
#side-title-text, #side-search { display: none; }
#side-emblem {
  width: 46px; height: 46px; border-radius: 14px; flex-shrink: 0; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, var(--accent), var(--accent-strong));
  box-shadow: 0 6px 16px var(--accent-glow);
}
#side-emblem svg { width: 24px; height: 24px; }
#side-title-text b, #side-title-text em { font-style: normal; font-size: 19px; font-weight: 700; letter-spacing: -.4px; line-height: 1.2; }
#side-title-text b { color: var(--text); }
#side-title-text em { color: var(--accent-strong); }
#ch-list {
  margin-top: auto; display: flex; flex-direction: column; gap: 4px;
  padding: 10px 6px 12px; overflow-y: auto; min-height: 0; scrollbar-width: none;
}
#ch-list::-webkit-scrollbar { display: none; }
@media (min-width: 768px) {
  #side-top { display: block; padding: 22px 16px 16px; }
  #side-title { margin-bottom: 16px; }
  #side-title-text { display: flex; flex-direction: column; }
  #side-search { display: block; }
  #ch-list { padding: 10px 10px 14px; }
}
@media (max-width: 640px) {
  body.has-side #brand { right: calc(var(--side-w) + 16px); }
  body.has-side.bars-hidden #brand { right: calc(var(--side-w) + 10px); }
}
.chip {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px;
  height: 34px; padding: 0 15px; border-radius: 999px;
  border: 1px solid var(--border); background: #fff; color: var(--muted);
  font: 500 13.5px var(--font); white-space: nowrap; cursor: pointer;
  transition: all .15s;
}
.chip svg { width: 16px; height: 16px; }
.chip:hover { background: var(--action-hover); color: var(--text); }
.chip.active { background: var(--accent-soft); border-color: #c9daff; color: var(--accent-strong); font-weight: 600; }

/* ── FEED ── */
#feed {
  max-width: 700px; margin: 0 auto;
  padding: 22px 16px 100px;
  display: flex; flex-direction: column; gap: 16px;
}
.date-divider {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 0 2px;
  color: var(--muted); font-size: 12.5px; font-weight: 600; letter-spacing: .3px;
}
.date-divider::before, .date-divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* ── MESSAGE CARD ── */
.msg-card { display: flex; align-items: flex-start; gap: 12px; position: relative; scroll-margin-top: 150px; }
.msg-avatar-col { flex-shrink: 0; padding-top: 22px; }
.avatar, .avatar-placeholder { width: 44px; height: 44px; border-radius: 50%; flex-shrink: 0; }
.avatar { display: block; object-fit: cover; background: #fff; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--border); }
.avatar-placeholder {
  display: none; align-items: center; justify-content: center;
  background: var(--accent-soft); color: var(--accent-strong);
  font-size: 18px; font-weight: 600;
}
.msg-main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.msg-meta { display: flex; align-items: baseline; gap: 8px; padding: 0 4px; flex-wrap: wrap; }
.msg-channel { font-size: 14.5px; font-weight: 600; letter-spacing: -.1px; }
.msg-time { font-size: 12px; color: var(--muted); font-weight: 500; white-space: nowrap; }
.msg-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11.5px; font-weight: 600; color: var(--accent-strong);
  background: var(--accent-soft); border-radius: 999px; padding: 1px 9px;
}

.msg-bubble {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 20px 10px;
  box-shadow: var(--shadow-card);
  transition: box-shadow .2s, border-color .2s;
}
.msg-card:hover .msg-bubble { border-color: #d9e2f3; box-shadow: var(--shadow-hover); }
.msg-text { font-size: 16px; line-height: 1.8; white-space: pre-wrap; word-break: break-word; }
.msg-text a { color: var(--accent-strong); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; overflow-wrap: anywhere; word-break: normal; }
.msg-text a:hover { color: var(--accent); text-decoration-thickness: 2px; }
mark.hl { background: #ffe98a; color: inherit; border-radius: 4px; padding: 1px 2px; margin: 0 -1px; }

.msg-image-wrap { position: relative; margin-top: 12px; display: block; }
.msg-image {
  display: block; max-width: 100%; max-height: 360px; object-fit: cover;
  border-radius: 14px; cursor: pointer; background: var(--signature-bg);
  transition: opacity .2s;
}
.msg-image:hover { opacity: .93; }

.msg-actions { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 10px; margin-inline-start: -8px; align-items: center; }
.action-btn {
  position: relative; width: 34px; height: 34px; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: none; border-radius: 50%; background: transparent; color: var(--muted);
  cursor: pointer; text-decoration: none; transition: all .15s;
}
.action-btn svg { width: 17px; height: 17px; }
.action-btn:hover { background: var(--accent-soft); color: var(--accent-strong); }
.action-btn.copied { background: #dcfce7; color: #15803d; }
.action-btn::after {
  content: attr(data-tooltip);
  position: absolute; bottom: calc(100% + 8px); right: 50%; transform: translateX(50%);
  background: var(--text); color: #fff; font-size: 12px; font-weight: 600; white-space: nowrap;
  padding: 5px 11px; border-radius: 7px; opacity: 0; pointer-events: none;
  transition: opacity .15s; z-index: 10;
}
.action-btn:hover::after { opacity: 1; }

.msg-card.msg-highlight .msg-bubble { animation: highlightFade 4s ease forwards; }
@keyframes highlightFade {
  0%, 50% { box-shadow: 0 0 0 3px var(--accent), 0 10px 34px rgba(68,120,234,.2); }
  100% { box-shadow: var(--shadow-card); }
}

/* ── STATES ── */
.state { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 15px; line-height: 1.9; }
.state b { display: block; color: var(--text); font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.spinner {
  width: 26px; height: 26px; margin: 0 auto 16px;
  border: 2.5px solid var(--border); border-top-color: var(--accent);
  border-radius: 50%; animation: spin .65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.more-btn {
  display: block; width: 100%; margin-bottom: 4px; padding: 12px;
  border: none; border-radius: var(--radius-sm);
  background: var(--accent-soft); color: var(--accent-strong);
  font: 700 13.5px var(--font); cursor: pointer; transition: background .15s;
}
.more-btn:hover { background: #dde8ff; }

/* ── FLOATING BUTTON / TOAST / LIGHTBOX ── */
#top-btn {
  display: none; position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  align-items: center; gap: 7px; padding: 10px 22px;
  background: var(--card-bg); color: var(--text);
  border: 1px solid var(--border); border-radius: 999px;
  font: 700 14px var(--font); cursor: pointer; z-index: 80; white-space: nowrap;
  box-shadow: 0 8px 24px rgba(30,37,51,.12); transition: all .15s;
}
#top-btn.visible { display: flex; }
#top-btn:hover, #top-btn.has-new { background: var(--accent); color: #fff; border-color: var(--accent); }
#top-btn.has-new:hover { background: var(--accent-strong); }

#toast {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(10px);
  background: var(--text); color: #fff; padding: 10px 20px; border-radius: 999px;
  font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: all .25s; white-space: nowrap; z-index: 200;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

#lightbox {
  display: flex; position: fixed; inset: 0; z-index: 999;
  align-items: center; justify-content: center; cursor: pointer;
  background: rgba(10,11,15,.92); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: opacity .16s ease-out, visibility 0s linear .16s;
}
#lightbox.open {
  opacity: 1; visibility: visible; pointer-events: auto;
  transition: opacity .16s ease-out, visibility 0s;
}
#lightbox img {
  max-width: 92vw; max-height: 92vh; border-radius: 14px; box-shadow: 0 30px 90px rgba(0,0,0,.5);
  transform: scale(.92); opacity: 0;
  transition: transform .14s ease-in, opacity .12s ease-in;
}
#lightbox.open img {
  transform: scale(1); opacity: 1;
  transition: transform .2s cubic-bezier(.2, .9, .3, 1), opacity .16s ease-out;
}

/* ── MOBILE ── */
@media (hover: none) { .action-btn::after { display: none; } }
@media (max-width: 640px) {
  #header { padding: 0 16px; }
  #brand { right: 16px; font-size: 17px; }
  body.bars-hidden #brand { right: 10px; }
  .tb-wrap { padding: 10px 12px; }
  #search-wrap { height: 44px; }
  #feed { padding: 16px 12px 100px; gap: 14px; }
  .msg-card { gap: 8px; }
  .msg-avatar-col { padding-top: 24px; }
  .avatar, .avatar-placeholder { width: 36px; height: 36px; font-size: 15px; }
  .msg-bubble { padding: 14px 15px 8px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ══ REDESIGN: same look as the news-feed site (header pill search, chip sidebar) ══ */
html{ scrollbar-width:none; -ms-overflow-style:none; }
html::-webkit-scrollbar,body::-webkit-scrollbar{ display:none; width:0; }
#header{ background:rgba(255,255,255,.86); }
#header-logo{
  width:34px; height:34px; border-radius:11px; border:0; box-shadow:none; padding:4px;
  object-fit:contain; background:linear-gradient(135deg,#eaf1ff,#dbe7ff);
}
#brand{ font-size:19px; font-weight:700; letter-spacing:-.4px; }
#status-pill{ background:#fff; }

/* chips: soft fill, no border; active = soft blue */
.chip{ height:auto; padding:8px 16px; border:0; background:var(--signature-bg); color:var(--muted); font:500 14px var(--font); }
.chip:hover{ background:var(--action-hover); color:var(--text); }
.chip.active{ background:var(--accent-soft); color:var(--accent-strong); font-weight:600; }
.chip svg{ width:17px; height:17px; }

/* search pill (soft fill, white on focus) */
#search-wrap{ background:var(--signature-bg); border:0; box-shadow:none; }
#search-wrap:focus-within{ background:#fff; box-shadow:0 0 0 3px var(--accent-glow); }
#header #search-wrap{ margin-inline-start:auto; width:280px; height:40px; padding:0 8px 0 14px; }
#header #search-wrap::after{
  content:'/'; flex-shrink:0; font:600 11px var(--font); color:var(--muted);
  background:#fff; border:1px solid var(--border); border-radius:6px; padding:2px 8px;
}
#header #search-wrap.has-value::after, #header #search-wrap:focus-within::after{ display:none; }
#header #search-wrap #q{ font-size:13.5px; }
#header #status-pill{ margin-inline-start:0; }

/* narrow screens: slim icon rail */
body.has-side{ --side-w:58px; }
body.has-side #channels{ background:var(--card-bg); -webkit-backdrop-filter:none; backdrop-filter:none; border-left:1px solid var(--border); }
#side-top{ padding:12px 6px; border-bottom:0; }
#side-emblem{ width:34px; height:34px; border-radius:11px; box-shadow:none; background:linear-gradient(135deg,#eaf1ff,#dbe7ff); color:var(--accent-strong); }
#side-emblem svg{ width:18px; height:18px; }
#ch-list{ gap:2px; padding:6px 7px 12px; margin-top:0; }
.ch-item{ padding:4px; border-radius:12px; }
.ch-item.active{ background:var(--accent-soft); border-color:transparent; }
.ch-ava{ width:34px; height:34px; }
.ch-ph,.ch-av{ border:2px solid #fff; }

/* wide screens: persistent chip sidebar */
@media (min-width:768px){
  body.has-side{ --side-w:244px; }
  #toolbar{ display:none; }

<script>
(function(){
  /* ════════════════════════════════════════════════════════════

     logo  כתובת לוגו (אווטאר + כותרת)

  var SHEET_ID = '1owfJJAx0IrMS4dn6VP1AG-4NQm-5ma3Iw7BLSKoSI0U';

  var CHANNELS = [
    { key: 'all', name: 'הכל', all: true, logo: ALL_ICON },

    { key: 'hatzalah', name: 'איחוד הצלה', tg: 'uh1221',
      logo: 'https://1221.org.il/app/uploads/2018/11/%D7%A1%D7%9E%D7%9C-%D7%9C%D7%95%D7%92%D7%95-%D7%90%D7%99%D7%97%D7%95%D7%93-%D7%94%D7%A6%D7%9C%D7%94-.png' },
    { key: 'mda', name: 'מד"א', tg: 'mdaisrael',

    { key: 'fire', name: 'כבאות והצלה', tg: 'fireisrael7777',

  ].map(function(c){ c.sheetId = SHEET_ID; c.sheetName = SHEET_NAME; c.refreshMs = 60000; return c; });

  var PAGE = 30, NEAR = 200;
  var S = {}, byKey = {}, byTg = {};
  CHANNELS.forEach(function(c){

    if (c.tg) byTg[c.tg] = c;
  });

  var cur = null, all = [], shown = PAGE, query = '', filter = 'all', newCount = 0;

  /* ── data ── */
  function fetchSheet(ch){
    return new Promise(function(res, rej){
      var cb = '__g' + Date.now() + '_' + (++fetchSeq), s = document.createElement('script');

        (function(){ var q = ch.all ? 'select * order by H desc limit ' + S[ch.key].limit : (ch.tg ? "select * where I = '" + ch.tg + "'" : ''); return q ? '&tq=' + encodeURIComponent(q) : ''; })() + '&headers=1&tqx=out:json;responseHandler:' + cb + '&_=' + Date.now();
      document.head.appendChild(s);
    });
  }
  function v(c){ return c && c.v != null ? c.v : null; }
  function pDate(x){
    if (typeof x !== 'string') return null;
    var m = x.match(/Date\((\d+),(\d+),(\d+)(?:,(\d+),(\d+),(\d+))?/);
    return m ? new Date(+m[1], +m[2], +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0)) : null;
  }
  function parse(d, ch){
    var rows = d.table.rows.map(function(r){
      var c = r.c || [];
      // עדיפות לעמודה H (חותמת זמן במילישניות); אחרת עמודה B
      var ts = v(c[7]), dt = null, known = false;
      if (ts != null && !isNaN(+ts) && +ts > 0){ dt = new Date(+ts); known = true; }
      else {
        dt = pDate(v(c[1]));

      }

    }).filter(function(m){ return m && m.id; });
    // ישן → חדש (בערוץ "הכל" לפי זמן, כי מספרי ההודעות נפרדים בכל ערוץ)
    return rows.sort(ch.all

  function esc(s){ return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

    var html = esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]"'])/g, function(u){

  var ICON = {

  function copyTo(btn, text, msg, icon){

  function card(m, q){

    }).catch(function(){});
  }
  $('ad-chips').onclick = function(e){ var b = e.target.closest('.ad-chip'); if (!b) return; var f = adCtx.fps[+b.getAttribute('data-i')]; f.on = !f.on; paintAd(); };
  $('ad-cancel').onclick = function(){ $('ad-modal').classList.remove('open'); };
  $('ad-modal').onclick = function(e){ if (e.target.id === 'ad-modal') $('ad-modal').classList.remove('open'); };
  $('ad-go').onclick = runAd;
  document.addEventListener('keydown', function(e){ if (e.key === 'Escape') $('ad-modal').classList.remove('open'); });
  loadRules(); setInterval(loadRules, 120000);

  /* ── events ── */
  function refresh(){ shown = PAGE; render(); jump(false); }
  if ($('q')) $('q').addEventListener('input', function(){
    query = this.value;
    $('search-wrap').classList.toggle('has-value', !!query);
    refresh();
  });
  if ($('clr')) $('clr').onclick = function(){
    $('q').value = ''; query = '';
    $('search-wrap').classList.remove('has-value'); refresh(); $('q').focus();
  };
  if ($('chips')) $('chips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    filter = b.getAttribute('data-f');
    Array.prototype.forEach.call(document.querySelectorAll('#chips .chip'), function(c){ c.classList.toggle('active', c === b); });
    refresh();
  });
  $('channels').addEventListener('click', function(e){
    var b = e.target.closest('.ch-item'); if (!b) return;
    var ch = byKey[b.getAttribute('data-ch')];
    if (ch && ch !== cur) selectChannel(ch);
  });
  $('feed').addEventListener('click', function(e){
    if (e.target.closest('#more')){ loadMore(); return; }
    var img = e.target.closest('.msg-image');
    if (img){ $('lightbox-img').src = img.src; $('lightbox').classList.add('open'); return; }
    var btn = e.target.closest('.action-btn[data-act]'); if (!btn) return;
    var uid = btn.closest('.msg-card').getAttribute('data-id');
    var m = all.find(function(x){ return x.uid === uid; }); if (!m) return;
    if (btn.getAttribute('data-act') === 'del'){ deleteMsg(m); return; }
    if (btn.getAttribute('data-act') === 'ad'){ openAd(m); return; }
    if (btn.getAttribute('data-act') === 'link')
      copyTo(btn, location.href.split('#')[0] + '#' + m.ch.key + '/msg-' + m.id, 'קישור להודעה הועתק', ICON.link);
    else
      copyTo(btn, m.text, 'הטקסט הועתק', ICON.copy);
  });
  // תמונות שנטענות אחרי הרינדור משנות את הגובה: נשארים בתחתית / מקבעים את מה שנראה
  $('feed').addEventListener('load', function(e){
    if (!e.target || e.target.tagName !== 'IMG') return;
    if (anchor){
      var dy = anchor.el.getBoundingClientRect().top - anchor.top;
      if (dy){ window.scrollBy(0, dy); lastY = window.scrollY; }
    } else if (stick){
      window.scrollTo(0, docH()); lastY = window.scrollY;
    }
  }, true);
  $('lightbox').onclick = function(){ this.classList.remove('open'); };
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') $('lightbox').classList.remove('open');
    else if (e.key === '/' && $('q') && document.activeElement !== $('q')){ e.preventDefault(); $('q').focus(); }
  });
  $('top-btn').onclick = function(){ stick = true; window.scrollTo({ top: docH(), behavior: 'smooth' }); newCount = 0; };
  window.addEventListener('scroll', checkScroll, { passive: true });
  window.addEventListener('scroll', function(){ if (window.scrollY < 500 && cur && S[cur.key].loaded) loadMore(); }, { passive: true });

  /* hide top bars while scrolling up into history, reveal on scroll down */
  lastY = window.scrollY;
  function updateBars(){
    var bars = $('topbars'), y = Math.max(0, window.scrollY), dy = y - lastY;
    if (y < 80){ setBars(true); lastY = y; }
    else if (dy < -6){            // גלילה למעלה, להיסטוריית ההודעות: הסרגל נעלם
      if (!bars.contains(document.activeElement)) setBars(false);
      lastY = y;
    } else if (dy > 6){ setBars(true); lastY = y; }  // גלילה למטה: הסרגל חוזר
    ticking = false;
  }
  function setBars(show){
    $('topbars').classList.toggle('hidden', !show);
    document.body.classList.toggle('bars-hidden', !show);
  }
  window.addEventListener('scroll', function(){
    if (!ticking){ ticking = true; requestAnimationFrame(updateBars); }
  }, { passive: true });
  if ($('q')) $('q').addEventListener('focus', function(){ setBars(true); });

  /* ── חיפוש: בסרגל הצד במסך רחב, בסרגל העליון במסך צר ── */
  var wideMq = window.matchMedia ? window.matchMedia('(min-width: 768px)') : null;
  function placeSearch(){
    var sw = $('search-wrap'), cp = $('chips'), tb = document.querySelector('.tb-wrap');
    if (!sw || !cp || !tb) return;
    if (wideMq && wideMq.matches){ $('header').insertBefore(sw, $('status-pill')); $('side-search').appendChild(cp); }
    else { tb.appendChild(cp); tb.insertBefore(sw, tb.firstChild); }
  }
  placeSearch();
  if (wideMq){ if (wideMq.addEventListener) wideMq.addEventListener('change', placeSearch); else wideMq.addListener(placeSearch); }

  /* ── start ── */
  buildChannels();
  pendingLink = parseHash();
  selectChannel(pendingLink ? byKey[pendingLink.key] : CHANNELS[0], !!(pendingLink && pendingLink.id));
})();
</script>
</body>
</html>
